name: Build
on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build Jekyll Site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.ref }}

      - name: Build
        uses: joshbeard/jekyll-build-action@0.1.0
        env:
          GIT_CEILING_DIRECTORIES: $GITHUB_WORKSPACE

      - uses: actions/upload-artifact@master
        with:
          name: src
          path: _site/

  minify:
    name: Minify
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@master
        with:
          name: src

      - name: Install minify
        run: |
          wget https://github.com/tdewolff/minify/releases/download/v2.10.0/minify_linux_amd64.tar.gz
          tar -xzf minify_linux_amd64.tar.gz
          chmod +x minify
          sudo mv minify /usr/local/bin/

      - name: ls
        run: ls -l

      - name: Minify
        run: minify --recursive --output . .

      - name: Upload artifact
        uses: actions/upload-artifact@master
        with:
          name: minify
          path: .

  validate:
    name: HTML Validation
    runs-on: ubuntu-latest
    needs: minify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@master
        with:
          name: minify
          path: _site

      - name: HTML5Validator
        uses: Cyb3r-Jak3/html5validator-action@v8.0.0
        with:
          root: _site/

  deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@master
        with:
          name: minify
          path: _site

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: 'us-west-2'

      - name: Deploy artifact to S3
        run: ruby util/deploy-site.rb --site-dir _site
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          CF_DISTRIBUTION: ${{ secrets.CF_DISTRIBUTION }}
          AWS_REGION: 'us-west-2'
          CF_REGION: 'us-east-1'
          SITE_URL: 'https://joshbeard.com'
