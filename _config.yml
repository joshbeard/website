# Jekyll config for joshbeard.com
---
name: Josh Beard
source: ./src
url: https://joshbeard.com
color_scheme: gel

feed:
  path: /feed.xml
  limit: 20
  title: Josh Beard
destination: ./_site
permalink: /posts/:year/:month/:day/:title:output_ext
collections:
  notes:
    output: true
    permalink: /notes/:year/:title/
include:
    - .well-known
exclude:
  - "Gemfile"
  - "Gemfile.lock"
  - "docker-compose.yml"
  - "README.md"
  - "LICENSE.md"
  - "vendor/"
  - "Makefile"
  - file_list.txt
  - album.yml
  - dist/
  - util/
  - .deploy/
markdown: kramdown

kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-target-blank
  - jekyll-sitemap
  - jekyll-navigation-tree

target-blank:
  add_css_classes: ext

defaults:
  - scope:
      path: "site/assets/**/*"
    values:
      sitemap: false
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      feed: notes
      class: notes-page

gallery:
  src_dir: src/photos
  out_dir: /photos
  thumbs_dir: thumbs
  all_photos:
    enabled: true
    path: all
    sort: album desc
    group_by_album: true
    reverse_images: false

nav_tree:
  excludes:
    - /sitemap.xml
    - /photos/*/*jpg.html
    - /photos/*/*jpeg.html
    - /photos/*/*JPG.html
    - /photos/*/*JPEG.html
    - /photos/all/*/*jpg.html
    - /photos/all/*/*JPG.html
    - /photos/all/*/*jpeg.html
    - /photos/all/*/*JPEG.html
    - /photos/*/*.yml
    - /assets*
    - /error.html
    - /sitemap.xml
    - /feed.xml
    - /pgp*
